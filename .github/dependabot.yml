version: 2
updates:
  # Gradle dependencies and wrapper
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "deps"
    open-pull-requests-limit: 10
    groups:
      gradle-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "gradle"
    # The wrapper follows the Grails line a repository is on (Gradle 8 for Grails 7, Gradle 9 for Grails 8), so it
    # only gets minor and patch updates. Dependabot names the wrapper `gradle-wrapper`, not `gradle`.
    ignore:
      - dependency-name: "gradle-wrapper"
        update-types: [ "version-update:semver-major" ]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "deps"
    groups:
      github-actions:
        patterns:
          - "*"
