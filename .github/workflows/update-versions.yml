# WARNING: Do not edit this file directly in your own repository.
# It is maintained in the grails-plugin-template repository.
# To make changes, edit it there and they will be synced automatically:
# https://github.com/grails-plugins/grails-plugin-template/tree/main/.github/workflows
name: Update GitHub Index Page

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to checkout and commit project.yml on'
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-versions:
    runs-on: ubuntu-24.04
    steps:
      # A pull request opened with GITHUB_TOKEN never triggers workflows, so on a
      # protected branch that requires status checks those checks would never
      # report and the fallback PR could not merge. Prefer the org's GitHub App
      # (the same credentials files-sync.yml uses) when it is configured, and
      # fall back to GITHUB_TOKEN where it is not. The secrets context is not
      # available in `if:`, so probe it through a step's env first.
      - name: "🔎 Check for GitHub App credentials"
        id: app-creds
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "${APP_ID}" ] && [ -n "${APP_PRIVATE_KEY}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No GitHub App credentials — using GITHUB_TOKEN"
          fi

      - name: "🔑 Mint GitHub App token"
        id: app-token
        if: steps.app-creds.outputs.available == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: "🔢 Update versions in project.yml and generate index.html"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/groovy.sh .github/scripts/update-versions.groovy

      - name: "📝 Commit project.yml if changed"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ inputs.branch || github.ref_name }}
          COMMIT_MESSAGE: "chore: update versions [skip ci]"
          PR_BRANCH: "chore/update-versions"
          PR_TITLE: "chore: update versions [skip ci]"
          PR_BODY: |
            Records the versions published by this release in `project.yml`.

            Opened automatically because the direct push to
            `${{ inputs.branch || github.ref_name }}` was rejected — that branch
            is protected. Merging this keeps the gh-pages version index in sync
            with what is on Maven Central.
        run: bash .github/scripts/commit-or-pr.sh project.yml

      - name: "🚀 Push updated index to gh-pages"
        run: |
          if [ ! -f build/index.html ]; then
            echo "No build/index.html generated — skipping gh-pages update"
            exit 0
          fi
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            echo "No gh-pages branch on origin yet — skipping gh-pages update. It will" \
                 "be created on this project's first release."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp build/index.html /tmp/index.html
          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/index.html index.html
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: update version index [skip ci]"
            git push origin gh-pages
          else
            echo "No index changes to push to gh-pages"
          fi
