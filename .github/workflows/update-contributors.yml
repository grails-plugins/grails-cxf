# WARNING: Do not edit this file directly in your own repository.
# It is maintained in the grails-plugin-template repository.
# To make changes, edit it there and they will be synced automatically:
# https://github.com/grails-plugins/grails-plugin-template/tree/main/.github/workflows
name: Update Contributors

on:
  push:
    branches:
      - '[0-9]+.[0-9]+.x'
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  JAVA_DISTRIBUTION: 'liberica'

jobs:
  update-contributors:
    runs-on: ubuntu-24.04
    steps:
      # A pull request opened with GITHUB_TOKEN never triggers workflows, so on a
      # protected branch that requires status checks those checks would never
      # report and the fallback PR could not merge. Prefer the org's GitHub App
      # (the same credentials files-sync.yml uses) when it is configured, and
      # fall back to GITHUB_TOKEN where it is not. The secrets context is not
      # available in `if:`, so probe it through a step's env first.
      - name: "🔎 Check for GitHub App credentials"
        id: app-creds
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "${APP_ID}" ] && [ -n "${APP_PRIVATE_KEY}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No GitHub App credentials — using GITHUB_TOKEN"
          fi

      - name: "🔑 Mint GitHub App token"
        id: app-token
        if: steps.app-creds.outputs.available == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: "📥 Checkout repository"
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: "Export .sdkmanrc properties"
        uses: apache/grails-github-actions/export-gradle-properties@asf
        with:
          file: ".sdkmanrc"
          prefix: "SDKMANRC_"

      - name: "Determine Java Version"
        run: echo "SDKMANRC_java=${{ env.SDKMANRC_java }}" | sed 's/-.*//' >> $GITHUB_ENV

      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.SDKMANRC_java }}

      - name: "🦊 Install Groovy ${{ env.SDKMANRC_groovy }}"
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install groovy ${{ env.SDKMANRC_groovy }} < /dev/null
          echo "$HOME/.sdkman/candidates/groovy/current/bin" >> $GITHUB_PATH

      - name: "👥 Update contributors in project.yml"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: groovy .github/scripts/update-contributors.groovy

      - name: "📝 Commit if changed"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: "chore: update contributors [skip ci]"
          PR_BRANCH: "chore/update-contributors"
          PR_TITLE: "chore: update contributors [skip ci]"
          PR_BODY: |
            Refreshes the `contributors` section of `project.yml` from the
            repository's commit history.

            Opened automatically because the direct push to
            `${{ github.ref_name }}` was rejected — that branch is protected.
        run: bash .github/scripts/commit-or-pr.sh project.yml
