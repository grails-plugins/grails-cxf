// WARNING: Do not edit this file directly in your own repository.
// It is maintained in the grails-plugin-template repository.
//
// https://github.com/grails-plugins/grails-plugin-template/tree/main/build-logic
// config.publish reads project metadata (githubOrg, projectTitle, ...) below, so it
// applies config.project-metadata itself rather than requiring every consumer to
// remember to. Applying it twice (if a build.gradle also applies it directly) is
// harmless — it just re-parses project.yml into the same extra properties.
pluginManager.apply('config.project-metadata')

// Useful when testing a release version locally and not wanting to setup signing
pluginManager.withPlugin('signing') {
    if (System.getenv('DISABLE_BUILD_SIGNING')) {
        logger.lifecycle('Signing is disabled for this build per configuration.')
        tasks.withType(Sign).configureEach {
            enabled = false
        }
    }
}
extensions.configure(org.apache.grails.gradle.publish.GrailsPublishExtension) {
    it.githubSlug = "${githubOrg}/${githubProject}"
    it.license.name = projectLicense
    it.title = projectTitle
    it.desc = projectDescription
    it.organization {
        it.name = projectOrg
        it.url = "https://github.com/${githubOrg}"
    }
    it.setDevelopers(projectContributors as Map)
}
