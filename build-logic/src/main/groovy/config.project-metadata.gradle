def projectYml = new groovy.yaml.YamlSlurper().parse(rootProject.file('project.yml')) as Map

extensions.extraProperties.set('projectTitle',        projectYml.project.title as String)
extensions.extraProperties.set('projectDescription',  projectYml.project.description as String)
extensions.extraProperties.set('projectOrg',          projectYml.project.org as String)
extensions.extraProperties.set('githubOrg',           projectYml.github.org as String)
extensions.extraProperties.set('githubProject',       projectYml.github.project as String)
extensions.extraProperties.set('projectLicense',      projectYml.license.name as String)
extensions.extraProperties.set('projectContributors', projectYml.contributors ?: [:])
extensions.extraProperties.set('projectVersions',     projectYml.versions ?: [:])
